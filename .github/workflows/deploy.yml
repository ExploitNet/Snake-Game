# ─────────────────────────────────────────────────────────────
#  استقرار خودکار روی GitHub Pages
#
#  بعد از push به شاخه‌ی main این Workflow به‌صورت خودکار:
#    1. پروژه را با Vite بیلد می‌کند
#    2. خروجی پوشه‌ی dist را روی GitHub Pages منتشر می‌کند
#
#  لینک نهایی پروژه:
#    https://<نام-کاربری>.github.io/<نام-مخزن>/
# ─────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # اجازه‌ی اجرای دستی از تب Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # base=./ باعث می‌شود مسیر فایل‌ها نسبی باشد و بازی
      # زیر دامنه‌ی github.io/<repo>/ بدون تنظیم اضافی اجرا شود
      - name: Build with Vite
        run: npm run build -- --base=./

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
